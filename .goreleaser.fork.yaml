version: 2

project_name: migrate

builds:
  - main: ./cmd/migrate
    binary: migrate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    # Keep in sync with the DATABASE and SOURCE lists in the Makefile
    tags:
      - postgres
      - mysql
      - redshift
      - cassandra
      - spanner
      - cockroachdb
      - yugabytedb
      - clickhouse
      - mongodb
      - sqlserver
      - firebird
      - neo4j
      - pgx
      - pgx5
      - rqlite
      - file
      - go_bindata
      - github
      - github_ee
      - bitbucket
      - aws_s3
      - google_cloud_storage
      - godoc_vfs
      - gitlab
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "{{ .ProjectName }}.{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github

brews:
  - name: migrate
    repository:
      owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
      name: homebrew-tap
      git:
        url: "git@github.com:{{ .Env.GITHUB_REPOSITORY_OWNER }}/homebrew-tap.git"
        private_key: "{{ .Env.TAP_DEPLOY_KEY }}"
    directory: Formula
    homepage: "https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
    description: "Database migrations CLI (fork with Azure Entra ID auth for SQL Server)"
    license: MIT
    conflicts:
      - golang-migrate
    test: |
      system "#{bin}/migrate", "-version"
